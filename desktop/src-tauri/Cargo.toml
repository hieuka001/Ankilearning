[package]
name = "ankilearning-desktop"
version = "1.0.4"
description = "AnkiLearning desktop shell"
edition = "2021"

[lib]
name = "ankilearning_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Needed to name the `OffsetDateTime` in the notification plugin's public
# `Schedule::At { date, .. }` API. `local-offset` powers the conversion of
# the web side's device-local wall-clock times into absolute instants.
time = { version = "0.3", features = ["local-offset"] }

# Desktop-only plugins. The updater supports Windows/Linux/macOS only, and
# single-instance has no mobile equivalent; dialog is only used by the
# desktop updater prompt. Keeping them out of the mobile dependency graph
# entirely (in addition to #[cfg(desktop)] at every use site) is what lets
# the iOS target compile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Android-only dependencies for the shell self-update (the desktop shell
# uses the Tauri updater instead): the dialog plugin shows the update
# prompt, ureq is the small blocking HTTPS client used to fetch the update
# manifest and download the APK, and the project-local apk-installer plugin
# opens the system package installer for the downloaded APK through the
# FileProvider the generated Android app already ships.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-apk-installer = { path = "../plugins/tauri-plugin-apk-installer" }
ureq = "2"

[profile.release]
opt-level = "s"
lto = true
